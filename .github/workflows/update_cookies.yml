name: Daily Cookie Updater

on:
  # 只允许手动触发，去掉所有定时任务
  workflow_dispatch:

jobs:
  update-cookie:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        pip install selenium psycopg2-binary webdriver-manager

    - name: 安装 Chrome 和 ChromeDriver
      uses: nanasess/setup-chromedriver@v2

    - name: 运行更新脚本
      env:
        JISILU_USER1: ${{ secrets.JISILU_USER1 }}
        JISILU_PASSWORD1: ${{ secrets.JISILU_PASSWORD1 }}
        JISILU_USER2: ${{ secrets.JISILU_USER2 }}
        JISILU_PASSWORD2: ${{ secrets.JISILU_PASSWORD2 }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python update_cookies.py